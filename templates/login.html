{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h1>Acessar IRSimple</h1>
  <p class="muted">Informe o usuario autorizado e a senha para acessar os dados do sistema.</p>
  <form method="post" class="grid-form">
    <label>E-mail
      <input type="email" name="username" value="{{ login_email or username }}" autocomplete="username" required>
    </label>
    <label>Senha
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="primary">Entrar</button>
  </form>
  <div class="mt-3 text-center">
    <a href="{{ url_for('forgot_password') }}" class="text-muted small">Esqueci minha senha</a>
  </div>
</section>
{% endblock %}
