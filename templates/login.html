{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h1>Acessar IRSimple</h1>
  <p class="muted">Escolha o usuario de trabalho. Cada usuario fica isolado no banco de dados.</p>
  <form method="post" class="grid-form">
    <label>Usuario
      <input name="username" value="{{ username }}" required>
    </label>
    <button type="submit" class="primary">Entrar</button>
  </form>
</section>
{% endblock %}
