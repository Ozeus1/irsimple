{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h1>Esqueci minha senha</h1>
  <p class="text-muted">Informe seu e-mail cadastrado e enviaremos um link para redefinir a senha.</p>
  <form method="post" class="grid-form">
    <label>E-mail
      <input type="email" name="email" autocomplete="email" required placeholder="{{ login_email or '' }}">
    </label>
    <button type="submit" class="btn btn-primary w-100">Enviar link de redefinicao</button>
  </form>
  <div class="mt-3 text-center">
    <a href="{{ url_for('index') }}">Voltar ao login</a>
  </div>
</section>
{% endblock %}
